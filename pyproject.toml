[project]
name = "ece-generative-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BaptVic78", email = "victor.rouleau@edu.ece.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.5.0",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "transformers>=5.22.2",
]

[project.scripts]
ece-generative-ai = "ece_generative_ai:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
